[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice"
version = "0.1.0"
description = "A small data pipeline runner that refuses to fail quietly."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pushpam Raj Satyarthi" }]
keywords = ["data-engineering", "etl", "pipeline", "data-quality", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Standard library only, on purpose. See docs/design-decisions.md section 8.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/pushpam2404/sluice"
Issues = "https://github.com/pushpam2404/sluice/issues"

[project.scripts]
sluice = "sluice.cli:main"

[tool.setuptools.packages.find]
include = ["sluice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
