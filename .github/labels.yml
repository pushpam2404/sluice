# Labels for sluice. Synced by .github/workflows/labels.yml on push to main.
#
# Two axes. difficulty says how much judgement is needed; area says what part of
# the project it touches.

# --- difficulty: exactly one per issue ---
- name: "difficulty: intermediate"
  color: "FBCA04"
  description: "A clear job. Two or three files, plus tests"
- name: "difficulty: advanced"
  color: "D93F0B"
  description: "A judgement call — several defensible answers exist"

# --- area ---
- name: "area: steps"
  color: "1D76DB"
  description: "A step in sluice/steps/ — one file, no conflicts"
- name: "area: checks"
  color: "1D76DB"
  description: "A check in sluice/checks/ — one file, no conflicts"
- name: "area: runner"
  color: "5319E7"
  description: "The core: pipeline, registry, context. Discuss before building"
- name: "area: cli"
  color: "5319E7"
  description: "The command line"
- name: "area: errors"
  color: "5319E7"
  description: "The error taxonomy — the thing the project is about"
- name: "area: docs"
  color: "0075CA"
  description: "README, design decisions, the authoring guides"
- name: "area: ci"
  color: "0E8A16"
  description: "Workflows and automation"

# --- kind ---
- name: "design-decision"
  color: "B60205"
  description: "Changes an answer in docs/design-decisions.md. Argue it on the issue first"
- name: "needs-discussion"
  color: "D4C5F9"
  description: "Comment with your approach before writing code"
- name: "good first issue"
  color: "7057FF"
  description: "A reasonable place to start, if you already write Python"
- name: "help wanted"
  color: "008672"
  description: "Open to anyone"
- name: "bug"
  color: "D73A4A"
  description: "Something is wrong"
- name: "enhancement"
  color: "A2EEEF"
  description: "A new capability"
- name: "test-coverage"
  color: "0E8A16"
  description: "Tests that should exist and do not"
- name: "security"
  color: "D93F0B"
  description: "Touches secrets, injection, or anything with a blast radius"
- name: "performance"
  color: "FEF2C0"
  description: "Speed or memory. Bring numbers"

# --- status ---
- name: "status: claimed"
  color: "FEF2C0"
  description: "Somebody is on it — pick a different one"
- name: "status: needs-review"
  color: "FEF2C0"
  description: "A pull request is open and waiting"
- name: "status: changes-requested"
  color: "E99695"
  description: "A reviewer has asked for changes"

# --- housekeeping ---
- name: "documentation"
  color: "0075CA"
  description: "Docs only"
- name: "duplicate"
  color: "CFD3D7"
  description: "Already exists elsewhere"
- name: "invalid"
  color: "E4E669"
  description: "Not actionable as written"
- name: "spam"
  color: "B60205"
  description: "Low effort. Closed without review"
