name: Report a bug
description: Something does not behave the way the docs say it does
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How do we reproduce it?
      description: A pipeline file and a command is ideal.
      render: shell
    validations: { required: true }
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: What did it print?
      description: Run with `--traceback` if it was an unexpected crash.
      render: shell
