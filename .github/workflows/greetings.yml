# Welcomes first-time contributors so nobody feels ignored during the event.
name: Greet new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    # Skip maintainers. Without this, seeding 30 issues fires 30 pointless runs,
    # and the run list becomes useless for spotting a real failure.
    if: >
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to sluice, and thanks for opening your first issue here.

            A maintainer will get to this within **48 hours**. In the meantime:
            - Read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)
            - Want to work on something? Browse the open issues and comment `/claim` on one
            - Stuck on setup? Comment on the issue saying what you have tried. Asking is not failing
          pr-message: |
            Congratulations on your first pull request to this repository.

            Here is what happens next:
            1. The checks below need to go green. If one is red, click **Details** to see why — that is normal, and fixing it is part of the work
            2. A maintainer reviews within **48 hours** and may leave line comments
            3. Once it is approved, a maintainer merges it

            Two things that get PRs closed, so please double-check:
            - No `Closes #<issue>` in the description
            - The issue was never assigned to you

            Nice work getting this far. Most people never open their first PR.
