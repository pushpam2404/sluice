# Blocks accidentally committed API keys, tokens, and passwords.
# Required on every repository in the org — Digital Defence owns the ruleset,
# OS & DevX ships the workflow so no repo is missed.
#
# Uses the gitleaks binary directly rather than gitleaks-action, because the
# action requires a paid GITLEAKS_LICENSE for organization accounts.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan commits

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository
        run: |
          CONFIG_FLAG=""
          if [ -f .gitleaks.toml ]; then CONFIG_FLAG="--config .gitleaks.toml"; fi
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            $CONFIG_FLAG

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
