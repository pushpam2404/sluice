# Releases issues that were claimed but abandoned, so one person cannot
# sit on a good first issue for the whole of October.
name: Release stale claims

on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST daily
  workflow_dispatch:

permissions:
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAYS = 5;
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'status: claimed', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (new Date(issue.updated_at).getTime() > cutoff) continue;

              // Do not release if the assignee has an open PR referencing it.
              const { data: search } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:open ${issue.number} in:body`,
              });
              if (search.total_count > 0) continue;

              const assignees = issue.assignees.map((a) => a.login);
              if (assignees.length === 0) continue;

              await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issue.number, assignees,
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'status: claimed',
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body:
                  `This issue has been unassigned after ${DAYS} days with no activity, ` +
                  `so someone else can pick it up.\n\n` +
                  `@${assignees.join(', @')} — if you are still working on it, just ` +
                  `comment \`/claim\` again and it is yours. No penalty.`,
              });
            }
